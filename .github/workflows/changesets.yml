name: Changesets

on:
  push:
    branches: [main]
  # A release can stop halfway for reasons that live outside the repository —
  # the npm trusted publisher pointing at the wrong workflow file is what did it
  # for 2.0.0. Once that is corrected there is nothing to commit, and without a
  # manual trigger the only ways to retry are re-running a failed job or pushing
  # an empty commit to main. Neither belongs in a release path.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm >= 11.5.1, and every Node 22 release ships
      # npm 10.9.x. Without this the CLI never detects the OIDC environment and
      # silently falls back to token auth — which, with no token configured,
      # means the publish fails at the last step of a release.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          # No --provenance: trusted publishing generates provenance
          # attestations automatically for a public package from a public repo.
          #
          # One command only. The action splits this string on whitespace and
          # execs it directly rather than handing it to a shell, so a `cmd-a &&
          # cmd-b` form does not chain: npm receives `&&` and everything after
          # it as extra arguments and appends them to the script body as escaped
          # literals, which is how `npm run build && npm publish` turned into
          # `shx chmod +x build/*.js '&&' 'npm' 'publish'` and failed with
          # "File not found: &&". The build is already covered twice — by the
          # Build step above and by the `prepare` lifecycle script, which npm
          # runs before packing on publish.
          #
          # `changeset publish` rather than `npm publish`: the action learns what
          # shipped from the structured output the changesets CLI writes, and
          # nothing else produces it. Publishing with npm directly worked — 2.0.0
          # reached the registry that way — but the action saw no released
          # packages, so it silently skipped the git tag and the GitHub release
          # and still reported success. changeset publish skips versions already
          # on the registry, so a re-run is safe.
          publish: npx changeset publish
          version: npm run version
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN is deliberately absent. Authentication comes from
          # the OIDC identity of this workflow (id-token: write above), which is
          # what the package's trusted publisher is configured against. Leaving
          # the token here would let a misconfigured trusted publisher fall back
          # silently, so nobody would notice it had stopped working.

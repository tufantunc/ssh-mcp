name: Changesets

on:
  push:
    branches: [main]
  # A release can stop halfway for reasons that live outside the repository —
  # the npm trusted publisher pointing at the wrong workflow file is what did it
  # for 2.0.0. Once that is corrected there is nothing to commit, and without a
  # manual trigger the only ways to retry are re-running a failed job or pushing
  # an empty commit to main. Neither belongs in a release path.
  workflow_dispatch:
    inputs:
      list_only:
        description: 'Skip the npm release and re-run only the post-publish jobs (MCP registry listing, SBOM attestation) for the version already on npm'
        type: boolean
        default: false

# Read-only default, so a job added here later starts with no write access until
# it asks. Every job below opts up explicitly — this block does not scope them. Without a default, a future job that declares
# nothing would inherit the repository setting instead, which lives outside this
# file and can be widened without anyone editing it.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # A `list_only` dispatch is for a version that reached npm but never reached
    # the registry, so it must not go near the publish path again.
    if: github.event.inputs.list_only != 'true'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    # Consumed by the `registry` job's `if:` below, which is where the gate is
    # explained.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No registry-url: publishing goes through OIDC against the default
      # registry, so the .npmrc setup-node would write for it — carrying an
      # authToken line for a token we deliberately do not set — has nothing to
      # contribute.
      # Node 24 (LTS) rather than 22, because it bundles npm 11.17.0 while every
      # Node 22 release ships npm 10.9.x — and trusted publishing needs
      # npm >= 11.5.1. Below that the CLI never detects the OIDC environment and
      # silently falls back to token auth, which with no token configured means
      # the publish fails at the last step of a release.
      #
      # This replaced a `npm install -g npm@11.19.0` step. That step existed to
      # clear the 11.5.1 bar on Node 22, and was pinned to an exact 11.x rather
      # than @latest because npm 12 changed the shape of `npm info <pkg> --json`
      # from an object carrying a `versions` array to an array: @changesets/cli
      # read `pkgInfo.versions`, got undefined, decided an already published
      # version had never shipped, and tried to publish over it. Fixed upstream
      # in @changesets/cli 2.31.1, which unwraps the array — so nothing is being
      # dodged by moving Node here, and npm 11.17.0 predates the shape change
      # anyway.
      #
      # The point of dropping the step is not the version. This job holds
      # `id-token: write` — it mints the OIDC token that publishes ssh-mcp — and
      # that install was the one thing it fetched from the registry outside the
      # lockfile, before `npm ci` runs. Taking the npm that ships with a pinned
      # Node removes a mutable reference from the publish path rather than
      # bumping it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # The requirement above is real but invisible: too old an npm does not
      # fail here, it fails four steps later as an authentication error that
      # reads like a misconfigured trusted publisher. Assert it instead, so a
      # Node image whose bundled npm regressed stops the release at the step
      # that can explain why.
      - name: Verify npm meets the trusted-publishing minimum
        run: |
          required=11.5.1
          actual="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $actual is older than $required. Trusted publishing would fall back to token auth, and no token is configured." >&2
            exit 1
          fi
          echo "node $(node -v), npm $actual"

      - run: npm ci

      - name: Build
        run: npm run build

      # The "Version Packages" pull request this opens will never show a green
      # `test`, and that is expected rather than broken. This action pushes
      # `changeset-release/main` using GITHUB_TOKEN, and GitHub does not start
      # workflows for pushes made with that token — the loop-breaker that stops
      # a workflow from triggering itself. So ci.yml never runs on that branch,
      # the `test` context required by the "Main Branch Protection" ruleset
      # never reports, and the PR sits at BLOCKED.
      #
      # Merging it therefore takes an admin bypass (`gh pr merge --admin`),
      # which the ruleset already allows: its bypass_actors carries the Admin
      # repository role at bypass_mode "always". Nothing needs adding, and
      # nothing narrower is available — ruleset bypasses are granted to actors
      # (roles, teams, apps, deploy keys), never to a branch, so "let only
      # changeset-release/main through" is not expressible.
      #
      # What makes that acceptable is that the check would not tell us anything
      # new. The ruleset sets strict_required_status_checks_policy, so the
      # release branch must be up to date with main before it can merge, and
      # ci.yml runs `test` on every push to main. The source being published has
      # already passed there; the release PR adds a version number and a
      # CHANGELOG entry on top of it.
      #
      # Before merging one, confirm exactly that: the PR touches only
      # package.json's version, CHANGELOG.md, server.json's two version fields
      # (written by `npm run version` — see scripts/sync-server-json.mjs) and
      # the consumed changeset files, and main is green at the commit it sits
      # on. An admin merge of anything wider is skipping a real check.
      - name: Create Release Pull Request or Publish
        id: changesets
        # v2, because the CLI is v3. The two are a matched pair and the action
        # says so itself: v2 refuses to run against CLI v2 ("use Changesets
        # action v1 instead"), and v1 cannot read what CLI v3 emits. Pairing v1
        # with CLI v3 is what half-published 2.7.0 — v1 detected releases by
        # grepping the publish script's stdout for `New tag: <pkg>@<version>`, a
        # line CLI v2 printed and CLI v3 does not. So `published` came out
        # `false` after npm had already accepted the tarball: no git tag, no
        # GitHub release, and both post-publish jobs below skipped, all while
        # the job reported success. The tag, release and SBOMs for v2.7.0 were
        # created by hand afterwards.
        #
        # That state is not reachable from here again. v2 does not parse stdout
        # for this: it points the CLI at a temporary NDJSON file through
        # CHANGESETS_OUTPUT and reads the `git-tag` events the CLI writes there,
        # so what it acts on is the CLI's own structured record of what shipped
        # rather than a human-readable line the CLI is free to reword.
        # And `validateChangesetsCliVersion` checks the pairing before anything
        # runs, which means a future bump of @changesets/cli back across a major
        # fails this step immediately instead of publishing and going quiet.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # No --provenance: trusted publishing generates provenance
          # attestations automatically for a public package from a public repo.
          #
          # One command only. The action splits this string on whitespace and
          # execs it directly rather than handing it to a shell, so a `cmd-a &&
          # cmd-b` form does not chain: npm receives `&&` and everything after
          # it as extra arguments and appends them to the script body as escaped
          # literals, which is how `npm run build && npm publish` turned into
          # `shx chmod +x build/*.js '&&' 'npm' 'publish'` and failed with
          # "File not found: &&". The build is already covered twice — by the
          # Build step above and by the `prepare` lifecycle script, which npm
          # runs before packing on publish.
          #
          # `changeset publish` rather than `npm publish`, and now for a
          # stronger reason than before: the action learns what shipped from the
          # NDJSON the CLI writes to CHANGESETS_OUTPUT, and only the changesets
          # CLI writes it. `npm publish` would leave that file absent — which
          # the action warns about rather than failing on, then reports nothing
          # released. v1 broke the same way for a different reason — it grepped
          # `npm publish`'s stdout for a line only the changesets CLI prints,
          # which is how 2.0.0 reached the registry with no tag and no release —
          # so the mechanism changed and the requirement did not.
          #
          # changeset publish also decides what to ship by asking the registry
          # first — `npm info` — which is why the npm version above matters: if
          # that lookup cannot be trusted, neither can this step.
          #
          # These four inputs were `publish`, `version`, `title` and `commit`
          # under v1. v2 renamed all four and throws on the old names, listing
          # the mapping — it does not ignore them, so a half-done rename fails
          # the release outright rather than publishing with the defaults.
          publish-script: npx changeset publish
          version-script: npm run version
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # No `github-token` and no GITHUB_TOKEN in the environment. The input
          # defaults to `github.token`, and v2 fails the step when the
          # environment variable is set to anything that disagrees with the
          # input — so passing the same token twice buys a way to break the
          # release and nothing else. The action puts it back into the publish
          # script's own environment itself.
          #
          # NODE_AUTH_TOKEN is deliberately absent for a different reason.
          # Authentication against npm comes from the OIDC identity of this
          # workflow (id-token: write above), which is what the package's
          # trusted publisher is configured against. Leaving a token here would
          # let a misconfigured trusted publisher fall back silently, so nobody
          # would notice it had stopped working.

  # An SBOM for what actually shipped, bound to the tarball consumers download.
  #
  # A job rather than steps on `release`, and for the same reason `registry` is one:
  # npm versions are immutable, so anything that can fail after `changeset publish`
  # returns must be re-runnable without going near the publish path again. Nothing
  # here can affect whether a release happens.
  #
  # The subject is the tarball fetched from npm, not one produced locally by
  # `npm pack`. A re-pack is *probably* byte-identical, and an attestation bound to a
  # digest nobody serves would be worse than none — it would verify against a file no
  # consumer has. What makes fetching safe is the integrity check below: without it
  # this job would sign whatever the network returned.
  sbom:
    name: attest an SBOM for the published package
    needs: release
    # Deliberately NOT the same gate as `registry`, despite the shared shape.
    #
    # `list_only` is included for the reason that input exists at all: `published` is
    # set only after the changesets action has pushed the tag and created the GitHub
    # release, so a failure in either leaves a version on npm that this workflow will
    # never revisit — and re-running `release` cannot fix it, because `changeset
    # publish` finds the version already there, releases nothing, and reports
    # `published: false` forever. Without a dispatch route that release would have no
    # SBOM and no way to obtain one, while the README says every release after v2.4.0
    # carries one. Re-running the job is idempotent: the same digest re-attests, and
    # the asset upload clobbers.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.release.outputs.published == 'true'
      || github.event.inputs.list_only == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      # Sign the attestations, and record them against the repository.
      #
      # Worth naming, because the `registry` job below explains the same hazard: npm's
      # trusted publisher is bound to a workflow *filename*, so any job in this file
      # holding `id-token: write` can mint a token npm would accept for ssh-mcp. This
      # is the third such job. What keeps it narrow is that every step is either a
      # SHA-pinned first-party action or a fixed command, and that `npm sbom
      # --package-lock-only` reads the lockfile without installing anything — measured
      # against a tree with no `node_modules` at all — so no dependency lifecycle
      # script executes here. `contents:` stays read; attaching the files to the
      # release needs write, and that is why it is a separate job below.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 24.x to match the release job — but unlike `registry`, where no npm version is
      # load-bearing, this is the job where it decides the artifact. `npm sbom` is an
      # npm subcommand: its availability, its `--package-lock-only` handling and its
      # CycloneDX/SPDX output shape all come from the bundled npm, and the SBOM is
      # what gets signed. A Node image whose npm changes that output publishes a
      # differently-shaped SBOM under a valid signature, silently.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # `--package-lock-only`, so this reads package-lock.json rather than an installed
      # tree. That is not only faster: an installed tree is filtered by the platform
      # that installed it, so `node_modules` on this runner omits optional dependencies
      # a Windows or macOS consumer would get. The lockfile describes what the package
      # declares, which is what an SBOM is for — 164 components against 153 from a
      # glibc Linux install, the difference being the `@napi-rs/keyring-*` optionals.
      #
      # `--omit=dev` because `files` is `build` only: nothing under devDependencies
      # reaches the published tarball, and listing them would describe a supply chain
      # the consumer does not have. It is doing real work — 164 against 397 without it.
      #
      # Both formats, and both are attested below. They are not redundant: CycloneDX is
      # what application-security tooling consumes, SPDX what licence and compliance
      # tooling does. A format shipped without an attestation would be decoration.
      - name: Generate SBOMs from the lockfile
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --package-lock-only --omit=dev > sbom.cdx.json
          npm sbom --sbom-format spdx --package-lock-only --omit=dev > sbom.spdx.json
          node -e "const c=require('./sbom.cdx.json');console.log('CycloneDX',c.specVersion,c.components.length,'components')"
          node -e "const s=require('./sbom.spdx.json');console.log('SPDX',s.spdxVersion,s.packages.length,'packages')"

      # `--retry-all-errors` rather than a hand-rolled loop. The registry serves a
      # published version to the CDN asynchronously, so this URL can 404 for a while
      # after `npm publish` returns; `-f` turns that into exit 22 and
      # `--retry-all-errors` is what makes curl retry it. `registry` keeps its own loop
      # for a reason documented there (packument caching) that does not apply to a
      # tarball GET, so this does not reuse it — and note the two jobs both hang off
      # `release` and run concurrently, so neither warms the other's CDN object.
      #
      # `-L` matters more than it looks: without it a 3xx is *success* to `-f`, which
      # checks only >= 400, and curl writes zero bytes. That empty file would sail into
      # the attestation as its subject.
      #
      # Then the check that makes any of this trustworthy. Without comparing against
      # the integrity npm itself publishes, this job signs whatever the network
      # returned — an attestation that cannot fail closed, which is the one kind worth
      # less than none.
      - name: Download and verify the published tarball
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"

          curl -fsSL --retry 30 --retry-delay 10 --retry-all-errors \
            -o package.tgz "https://registry.npmjs.org/$name/-/$name-$version.tgz"

          expected="$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://registry.npmjs.org/$name/$version" \
            | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).dist.integrity')"
          actual="sha512-$(openssl dgst -sha512 -binary package.tgz | base64 | tr -d '\n')"

          if [ "$expected" != "$actual" ]; then
            echo "::error::tarball digest does not match the registry's dist.integrity for $name@$version." >&2
            echo "::error::expected $expected, got $actual" >&2
            exit 1
          fi
          echo "$name@$version verified: $actual ($(wc -c < package.tgz) bytes)"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      # `actions/attest`, not `actions/attest-sbom`. The latter is deprecated — its own
      # first step emits a deprecation warning and its only other step forwards these
      # exact inputs to this action.
      - name: Attest the CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: package.tgz
          sbom-path: sbom.cdx.json

      - name: Attest the SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: package.tgz
          sbom-path: sbom.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 7

      - name: Record the release tag for the asset job
        run: echo "$RELEASE_TAG" > release-tag.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tag
          path: release-tag.txt
          retention-days: 7

  # The readable half, split off so that `contents: write` never sits in the same job
  # as `id-token: write`. The attestation above is the verifiable artifact and is
  # already published by the time this runs; these files are for anyone answering
  # "does this pull in <package>?" without a toolchain. If this job fails, nothing of
  # value is lost — which is exactly why it does not belong upstream of the signing.
  sbom-assets:
    name: attach the SBOMs to the release
    needs: sbom
    # `!cancelled()` for a reason the `sbom` job's own gate does not cover:
    # skips propagate transitively. `release` is skipped on a `list_only`
    # dispatch, `sbom` runs anyway on its own `!cancelled()` gate — and this job
    # was still skipped even with `sbom` reporting success, because a default
    # `if:` also looks upstream of its direct `needs`. Measured on the recovery
    # dispatch for 2.7.0: sbom success, this job skipped, and the two files had
    # to be uploaded by hand. Which made the escape hatch unable to do the one
    # thing it exists for.
    #
    # `needs.sbom.result == 'success'` rather than nothing, because
    # `!cancelled()` alone would run this after a *failed* sbom job, where
    # release-tag.txt does not exist and `cat` would fail on a missing file
    # instead of reporting the real problem upstream.
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{sbom,release-tag}'
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(cat release-tag.txt)"
          # `--repo` because this job downloads artifacts and never checks out, so
          # there is no git remote for `gh` to infer the repository from. Without it
          # the upload died with "fatal: not a git repository" on the 2.4.1 release —
          # after the attestation had been signed and published, which is the split
          # working as intended: the verifiable artifact shipped, only the readable
          # copies were missing.
          gh release upload "$tag" sbom.cdx.json sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"

  # Listing on the official MCP registry (registry.modelcontextprotocol.io).
  #
  # A job rather than more steps on `release`, because npm versions are
  # immutable: a combined job that failed at the registry could not be re-run —
  # the retry would die earlier, republishing a version npm already has, and the
  # part that actually broke would never be reached. This one retries alone.
  #
  # And a job rather than a second workflow. The obvious shape — trigger on the
  # `v*` tag the changesets action pushes — cannot work here: that tag is pushed
  # with GITHUB_TOKEN, and GitHub starts no workflows for those pushes. It is the
  # same loop-breaker that keeps ci.yml off changeset-release/main, described at
  # the release step above.
  registry:
    name: list on the MCP registry
    needs: release
    # Most runs of this workflow open or update the "Version Packages" pull
    # request and publish nothing, so listing has to be gated on a release
    # actually having happened — otherwise this job runs on every merge to main
    # and fails against a version already listed.
    #
    # `!cancelled()` rather than the bare condition, because `needs:` alone means
    # "only if release succeeded" and there are states where npm has published
    # and the release job still fails: the action pushes the git tag and creates
    # the GitHub release *after* `changeset publish` returns, and it exits
    # non-zero on a publish whose exit code was non-zero even when packages
    # shipped. Skipping here in those states is unrecoverable — a re-run of
    # `release` finds the version already on npm, releases nothing, and reports
    # `published: false` forever.
    #
    # `list_only` is the escape hatch for the one state this still cannot see: a
    # failure before the action set its output at all. Dispatch it and this job
    # runs against whatever `server.json` names on main.
    #
    # The ref guard is because `workflow_dispatch` accepts any ref, and a
    # dispatch from another branch would otherwise list that branch's
    # `server.json` under our namespace.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.release.outputs.published == 'true'
      || github.event.inputs.list_only == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher exchanges this for a registry token, and the
      # `io.github.tufantunc/*` namespace is authorised from the repository owner
      # in its claims. No secret here either — same mechanism as the npm publish.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed by all three steps below that shell out to node: the `--check`
      # run, the version read, and the identifier read. No `npm ci` — none of
      # them touch node_modules. 24.x only to match the release job; unlike
      # there, no npm version is load-bearing here, and `engines` allows far
      # older.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # Pinned, not `latest/download`. This binary mints the credential that
      # publishes under our namespace, which makes it exactly the kind of
      # mutable reference the release job above went out of its way to remove
      # from the publish path. The cost is that a registry API change eventually
      # needs this bumped by hand — and that failure lands here, in the one job
      # that can be re-run, with npm already safely published.
      #
      # The digest is the other half of that. A release tag in the URL pins a
      # *release*, not its bytes: GitHub release assets can be replaced in place,
      # so the tag alone gives none of the immutability a SHA-pinned action or an
      # npm version does. That matters more here than it would elsewhere in this
      # file, because npm's trusted publisher is bound to a workflow *filename*
      # — this one — so anything executing in this job can mint a token npm will
      # accept for ssh-mcp. The digest is published upstream in
      # registry_1.8.1_checksums.txt; bumping the version means bumping both
      # lines.
      #
      # Verified before extraction rather than after, so a replaced archive is
      # never handed to tar.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' \
            | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      # server.json carries the version twice, and `npm run version` — wired to
      # scripts/sync-server-json.mjs — is what keeps both in step with
      # package.json inside the release pull request. `--check` asserts that it
      # happened: if the script would have anything to write, the listing about
      # to be published names a version other than the one that just shipped.
      #
      # Left to the registry, the same mistake arrives as a 404 from npm, or as
      # a successful listing for the wrong version.
      - name: server.json must already agree with package.json
        run: node scripts/sync-server-json.mjs --check

      # Everything server.json must satisfy that does not depend on npm: required
      # fields, the name pattern, the 100-character title and description caps,
      # the enums. It POSTs to a registry endpoint that needs no credentials, so
      # it runs before `login`.
      #
      # This replaced a hand-rolled copy of two of those rules in
      # scripts/sync-server-json.mjs, written on the belief that mcp-publisher
      # only reports them at publish time. It does not — and two rules copied out
      # of a pinned schema would have gone stale the first time that URL moved.
      #
      # Before the npm wait, not after: it takes a second, and there is no reason
      # to spend five minutes on propagation only to fail on a malformed listing.
      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate

      # The registry resolves packages[].version against npm and rejects what it
      # cannot see. `npm publish` returning is not the same as the CDN serving
      # the new version, so wait for it rather than racing it.
      #
      # This asks the registry's own question — a GET of the version manifest at
      # `registry.npmjs.org/<identifier>/<version>`, which is literally the URL
      # the npm validator builds — rather than a near-enough one. Two reasons it
      # is not `npm view`:
      #
      #   `npm view pkg@version` fetches the whole packument and resolves the
      #   version locally, and npm serves packuments with `max-age=300` while
      #   defaulting `prefer-online` to false. Attempt 1 would cache a document
      #   that lacks the new version and attempts 2..30 could all be answered
      #   from it — a 290-second window entirely inside the 300-second one. The
      #   loop would report "never became visible" while npm was serving it.
      #
      #   And the name has to come from server.json's identifier, not a literal:
      #   the identifier is what the registry resolves, so polling anything else
      #   can confirm a package the listing does not point at. The sync script
      #   pins that identifier to package.json's name, which is what makes
      #   reading it here safe.
      - name: Wait for npm to serve the published version
        run: |
          set -euo pipefail
          identifier="$(node -p 'require("./server.json").packages.find((p) => p.registryType === "npm").identifier')"
          version="$(node -p 'require("./package.json").version')"
          url="https://registry.npmjs.org/$identifier/$version"
          attempts=30
          for i in $(seq 1 "$attempts"); do
            # Keep the reason. Discarding it made a 404, a 429, an npm outage and
            # a runner DNS failure all read as "not yet visible", on the one job
            # whose whole purpose is to be diagnosable.
            if err="$(curl -fsS -o /dev/null "$url" 2>&1)"; then
              echo "$identifier@$version is visible on npm"
              exit 0
            fi
            echo "attempt $i/$attempts: not visible yet ($err)"
            if [ "$i" -lt "$attempts" ]; then
              sleep 10
            fi
          done
          echo "::error::$identifier@$version never became visible on npm. Last error: $err" >&2
          exit 1

      - name: Publish to the registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

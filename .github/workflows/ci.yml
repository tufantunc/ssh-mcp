name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ssh-admin:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: admin
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: secret
          SUDO_ACCESS: "true"
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
      ssh-viewer:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: viewer
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: viewpass
        ports:
          - 2223:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
      ssh-operator:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          USER_NAME: operator
          PASSWORD_ACCESS: "true"
          USER_PASSWORD: oppass
          SUDO_ACCESS: "true"
        ports:
          - 2224:2222
        options: >-
          --health-cmd="nc -z localhost 2222 || exit 1"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Dependency resolution check
        run: npm ls zod zod-to-json-schema @modelcontextprotocol/sdk --all

      - name: Wait for all sshd servers
        run: |
          for port in 2222 2223 2224; do
            for i in {1..60}; do
              nc -z 127.0.0.1 $port && echo "sshd on $port ready" && break
              sleep 1
            done
          done

      - name: Run tests
        env:
          SSH_MCP_DISABLE_MAIN: "1"
          SSH_MCP_ADMIN_PASSWORD: secret
          SSH_MCP_OPERATOR_PASSWORD: oppass
          SSH_MCP_VIEWER_PASSWORD: viewpass
          SSH_MCP_ADMIN_SUDO_PASSWORD: secret
          SSH_MCP_OPERATOR_SUDO_PASSWORD: oppass
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/typescript
            p/owasp-top-ten
            p/command-injection

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

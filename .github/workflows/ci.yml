name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

# Read-only default for GITHUB_TOKEN. A job that declares nothing — the `test`
# job does not — would otherwise inherit the repository setting, which lives
# outside this file and can be widened without anyone editing it.
#
# Two things this does NOT do, since the wording invites both mistakes:
# `permissions` gates GITHUB_TOKEN only and has no effect on `secrets.*`, so the
# test job still receives the Docker Hub and Codecov tokens. And a job-level
# block replaces this one rather than extending it — adding a scope here does
# not reach any job that declares its own.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Read here rather than in the step's `if:` so the condition can be
      # evaluated at all — and so a pull request from a fork, which is never
      # given secrets, resolves it to empty instead of failing.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The pnpm packaging test is the only real check that the OTEL imports are
      # declared rather than resolved by npm's hoisting. Without pnpm on the
      # runner it skipped, so the check it exists for never ran in CI.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - run: npm ci

      - name: Build
        # Also required by the e2e suite, which drives the built artifact.
        run: npm run build

      - name: Dependency resolution check
        run: npm ls zod zod-to-json-schema @modelcontextprotocol/sdk --all

      - name: Typecheck (src + tests)
        run: npm run typecheck

      # docker compose rather than `services:`, because two of the test servers
      # build from local Dockerfiles (Alpine/busybox-ash and Dropbear) and one
      # mounts an init script — none of which a service container can express.
      # It also gives the containers a shared network, which the ProxyJump test
      # needs to resolve the target host from inside the bastion.
      #
      # Keeping one definition also stops CI and docker-compose.yml drifting:
      # CI used to define three of the six servers and none of the sshd tuning.
      # Anonymous pulls are rate limited per IP and Actions runners share IPs,
      # so the quota goes to whoever else is on that address. Authenticating
      # moves the limit onto this account, where a handful of images is nothing.
      #
      # This covers `alpine:3.20` and `node:22-slim`, which the build pulls from
      # Docker Hub. It does *not* cover the sshd image — that comes from GHCR,
      # and it was the one that actually failed on 2026-08-10. Both registries
      # are behind the retry below.
      - name: Log in to Docker Hub
        # Skipped on pull requests from forks, which are never given secrets.
        # Those keep pulling anonymously; the retry is what covers them.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pull separately from `up` so a throttled registry is retried rather than
      # failing the job, and so the failure — if it survives three tries — names
      # the registry instead of surfacing as an opaque compose error.
      - name: Pull images
        run: |
          for attempt in 1 2 3; do
            if docker compose --profile test pull --quiet; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Image pull failed (attempt $attempt/3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Could not pull the test images after 3 attempts — registry rate limit or outage"
          exit 1

      - name: Start SSH test servers
        run: docker compose --profile test up -d --build --wait

      - name: Wait for all sshd servers
        run: |
          for port in 2222 2223 2224 2225 2226 2227; do
            ready=false
            for i in $(seq 1 60); do
              if nc -z 127.0.0.1 $port; then echo "sshd on $port ready"; ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then echo "::error::sshd on $port never became ready"; exit 1; fi
          done

      - name: Run tests
        env:
          SSH_MCP_DISABLE_MAIN: "1"
          SSH_MCP_ADMIN_PASSWORD: secret
          SSH_MCP_OPERATOR_PASSWORD: oppass
          SSH_MCP_VIEWER_PASSWORD: viewpass
          SSH_MCP_ADMIN_SUDO_PASSWORD: secret
          SSH_MCP_OPERATOR_SUDO_PASSWORD: oppass
          # Without this, integration tests silently skip themselves when a
          # server is unreachable and CI reports green with zero of them run.
          SSH_MCP_REQUIRE_SERVERS: "1"
        # Same suite as `npm test`, with the v8 reporter attached so the run
        # that proves the code works is also the one the coverage report comes
        # from.
        run: npm run coverage

      # An empty or missing report uploads happily and renders as 0%, which is
      # indistinguishable from having no tests. Fail here instead, where the
      # cause is obvious — but leave the upload itself non-fatal, so our own
      # mistakes break the build and Codecov's outages do not.
      - name: Check the coverage report was produced
        run: |
          test -s coverage/lcov.info || { echo "coverage/lcov.info missing or empty"; exit 1; }
          echo "lcov records: $(grep -c '^SF:' coverage/lcov.info)"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      # Service containers surface their logs in the UI automatically; compose
      # containers do not, so a failure would otherwise be undebuggable.
      - name: SSH server logs
        if: failure()
        run: docker compose --profile test logs --tail=100

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans a commit range, which the default shallow clone
          # (depth 1) cannot resolve: it fails with "unknown revision" and exits
          # non-zero having scanned nothing — a red build that says "no leaks
          # found in partial scan". Full history is what makes the scan real.
          fetch-depth: 0

      # Run the image directly instead of returntocorp/semgrep-action. That action
      # is a Docker action whose action.yml is fifteen lines pointing at
      # `docker://returntocorp/semgrep-agent:v1`, so pinning its commit freezes the
      # YAML and none of the code that executes. The project is marked deprecated
      # and was last pushed in January 2024, and that image can no longer parse the
      # current rule packs: it died with
      #
      #   ValueError: invalid rule severity value: MEDIUM
      #
      # exited 0, and the step reported success. This gate had been scanning
      # nothing while reporting green — which is the failure mode the rest of this
      # workflow exists to prevent. `--error` is what makes findings fail the job,
      # and the summary is left on deliberately: it ends with a line like
      # "Ran 112 rules on 90 files: 0 findings", so a clean run leaves evidence it
      # scanned rather than only the absence of complaint.
      - name: Semgrep Scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8 \
            semgrep scan --error --metrics=off \
              --config=p/javascript \
              --config=p/nodejs \
              --config=p/typescript \
              --config=p/owasp-top-ten \
              --config=p/command-injection \
              --exclude=docker/alpine-sshd/Dockerfile \
              --exclude=docker/dropbear-sshd/Dockerfile

      # Excluded above rather than suppressed globally: both are throwaway test
      # fixtures running sshd, which has to be root to authenticate users and open
      # shells as them, so `missing-user` is wrong for these two files and right
      # everywhere else.

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4 (branch, not a tag)
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The pnpm packaging test is the only real check that the OTEL imports are
      # declared rather than resolved by npm's hoisting. Without pnpm on the
      # runner it skipped, so the check it exists for never ran in CI.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - run: npm ci

      - name: Build
        # Also required by the e2e suite, which drives the built artifact.
        run: npm run build

      - name: Dependency resolution check
        run: npm ls zod zod-to-json-schema @modelcontextprotocol/sdk --all

      - name: Typecheck (src + tests)
        run: npm run typecheck

      # docker compose rather than `services:`, because two of the test servers
      # build from local Dockerfiles (Alpine/busybox-ash and Dropbear) and one
      # mounts an init script — none of which a service container can express.
      # It also gives the containers a shared network, which the ProxyJump test
      # needs to resolve the target host from inside the bastion.
      #
      # Keeping one definition also stops CI and docker-compose.yml drifting:
      # CI used to define three of the six servers and none of the sshd tuning.
      - name: Start SSH test servers
        run: docker compose --profile test up -d --build --wait

      - name: Wait for all sshd servers
        run: |
          for port in 2222 2223 2224 2225 2226 2227; do
            ready=false
            for i in $(seq 1 60); do
              if nc -z 127.0.0.1 $port; then echo "sshd on $port ready"; ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then echo "::error::sshd on $port never became ready"; exit 1; fi
          done

      - name: Run tests
        env:
          SSH_MCP_DISABLE_MAIN: "1"
          SSH_MCP_ADMIN_PASSWORD: secret
          SSH_MCP_OPERATOR_PASSWORD: oppass
          SSH_MCP_VIEWER_PASSWORD: viewpass
          SSH_MCP_ADMIN_SUDO_PASSWORD: secret
          SSH_MCP_OPERATOR_SUDO_PASSWORD: oppass
          # Without this, integration tests silently skip themselves when a
          # server is unreachable and CI reports green with zero of them run.
          SSH_MCP_REQUIRE_SERVERS: "1"
        run: npm test

      # Service containers surface their logs in the UI automatically; compose
      # containers do not, so a failure would otherwise be undebuggable.
      - name: SSH server logs
        if: failure()
        run: docker compose --profile test logs --tail=100

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit range, which the default shallow clone
          # (depth 1) cannot resolve: it fails with "unknown revision" and exits
          # non-zero having scanned nothing — a red build that says "no leaks
          # found in partial scan". Full history is what makes the scan real.
          fetch-depth: 0

      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/typescript
            p/owasp-top-ten
            p/command-injection

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

# Test-fixture images are pinned by digest. These containers are the system
# under test for an SSH security tool: a silently changed sshd could make
# host-key verification, ProxyJump or an auth-failure test pass when it should
# fail, and nothing would say so. The tag is kept alongside the digest so the
# version stays readable; the digest is what resolves.
#
# The root Dockerfile's `node:22-slim` is deliberately NOT pinned. That image
# builds the server rather than deciding whether a test is honest, so picking up
# base-image security patches on rebuild is worth more there than reproducibility.

services:
  # ─── Test SSH Servers (role-based, for integration tests) ──────────────────
  ssh-admin:
    image: ghcr.io/linuxserver/openssh-server:latest@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
    profiles: ["test"]
    environment:
      - USER_NAME=admin
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=secret
      - SUDO_ACCESS=true
    volumes:
      - ./docker/test-server-init.sh:/custom-cont-init.d/10-test-limits:ro
    ports:
      - "2222:2222"

  ssh-viewer:
    image: ghcr.io/linuxserver/openssh-server:latest@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
    profiles: ["test"]
    environment:
      - USER_NAME=viewer
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=viewpass
    volumes:
      - ./docker/test-server-init.sh:/custom-cont-init.d/10-test-limits:ro
    ports:
      - "2223:2222"

  ssh-operator:
    image: ghcr.io/linuxserver/openssh-server:latest@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
    profiles: ["test"]
    environment:
      - USER_NAME=operator
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=oppass
      - SUDO_ACCESS=true
    volumes:
      - ./docker/test-server-init.sh:/custom-cont-init.d/10-test-limits:ro
    ports:
      - "2224:2222"

  # Bastion for ProxyJump (`profile.via`) tests. Identical to ssh-admin except
  # that an init hook enables AllowTcpForwarding, which the base image disables
  # — without it every direct-tcpip channel fails and the hop cannot be tested.
  ssh-bastion:
    image: ghcr.io/linuxserver/openssh-server:latest@sha256:96b9a4d3b5106746d08d43a6911650d4d21f7d5c7f2ac9660e792bdb5e63157c
    profiles: ["test"]
    environment:
      - USER_NAME=bastion
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=bastionpass
    volumes:
      - ./docker/bastion-init.sh:/custom-cont-init.d/10-allow-forwarding:ro
      - ./docker/test-server-init.sh:/custom-cont-init.d/20-test-limits:ro
    ports:
      - "2225:2222"

  # A different sshd/shell combination from the three above: Alpine with
  # busybox `ash` instead of Debian with bash. The session protocol talks to
  # whatever shell the host runs, so this is the axis that matters — the README
  # claims broad host support and every other test target was the same image.
  ssh-alpine:
    build: ./docker/alpine-sshd
    profiles: ["test"]
    ports:
      - "2226:2222"

  # A different sshd implementation entirely (not OpenSSH). Dropbear supports a
  # narrower algorithm set, so it is the only target that proves
  # FROZEN_ALGORITHMS can negotiate outside the OpenSSH family.
  ssh-dropbear:
    build: ./docker/dropbear-sshd
    profiles: ["test"]
    ports:
      - "2227:2222"

  # ─── SSH MCP Server v2 ────────────────────────────────────────────────────
  ssh-mcp:
    # Above the server's own 5s teardown budget (see SHUTDOWN_BUDGET_MS): closing a
    # background session now waits for its kill ladder, and the 10s default left the
    # container SIGKILLed mid-teardown.
    stop_grace_period: 20s
    build: .
    profiles: ["app"]
    stdin_open: true
    environment:
      - SSH_MCP_PASSWORD=${SSH_MCP_PASSWORD}
      - SSH_MCP_SUDO_PASSWORD=${SSH_MCP_SUDO_PASSWORD}
    volumes:
      - ./config.local.toml:/home/appuser/.config/ssh-mcp/config.toml:ro
      - ~/.ssh:/home/appuser/.ssh:ro
      - ssh-mcp-audit:/home/appuser/.local/share/ssh-mcp

volumes:
  ssh-mcp-audit:

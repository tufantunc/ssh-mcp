services:
  # ─── Test SSH Servers (role-based, for integration tests) ──────────────────
  ssh-admin:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["test"]
    environment:
      - USER_NAME=admin
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=secret
      - SUDO_ACCESS=true
    ports:
      - "2222:2222"

  ssh-viewer:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["test"]
    environment:
      - USER_NAME=viewer
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=viewpass
    ports:
      - "2223:2222"

  ssh-operator:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["test"]
    environment:
      - USER_NAME=operator
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=oppass
      - SUDO_ACCESS=true
    ports:
      - "2224:2222"

  # ─── SSH MCP Server v2 ────────────────────────────────────────────────────
  ssh-mcp:
    build: .
    profiles: ["app"]
    stdin_open: true
    environment:
      - SSH_MCP_PASSWORD=${SSH_MCP_PASSWORD}
      - SSH_MCP_SUDO_PASSWORD=${SSH_MCP_SUDO_PASSWORD}
    volumes:
      - ./config.local.toml:/home/appuser/.config/ssh-mcp/config.toml:ro
      - ~/.ssh:/home/appuser/.ssh:ro
      - ssh-mcp-audit:/home/appuser/.local/share/ssh-mcp

volumes:
  ssh-mcp-audit:
